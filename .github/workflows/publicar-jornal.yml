name: Publicar jornal diário

on:
  schedule:
    - cron: '20 10 * * *' # 07h20 em Salvador (UTC-3); publicação pode atrasar
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publicacao-jornal
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Montar edição com fontes verificáveis
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini
        run: python scripts/update.py
      - name: Registrar e preservar edições
        run: |
          git config user.name "Editor do Jornal"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/bootstrap.js data/archive/
          if ! git diff --cached --quiet; then
            git commit -m "Edição diária automática"
            git push
          fi
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Empacotar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
